# Render configuration for the MedSphere API.
#
# NOTE: Blueprints (auto-provisioning from this file) are a paid Render feature.
# On the free plan, create the service by hand instead — this file then serves as
# a record of the exact settings to enter:
#
#   Dashboard -> New -> Web Service -> connect this repo, then:
#
#     Name                medsphere-api          (any unused name)
#     Language            Python 3
#     Branch              main
#     Root Directory      Backend                <- important, not the repo root
#     Build Command       pip install -r requirements.txt
#     Start Command       gunicorn app:app --workers 1 --threads 4 --timeout 120 --preload --bind 0.0.0.0:$PORT
#     Instance Type       Free
#     Health Check Path   /healthz               (under Advanced)
#
#   Environment variables to add:
#     GEMINI_API_KEY      <your rotated key>     required for AI recommendations
#     PYTHON_VERSION      3.12.3                 matches the pinned wheels
#     GEMINI_MODEL_NAME   gemini-2.5-flash       optional, this is the default
#     ALLOWED_ORIGINS     optional; comma-separated CORS allowlist override.
#                         Defaults already include https://medsphere707.netlify.app
#
# The frontend is hosted on Netlify (see netlify.toml), so no static service is
# defined here.
#
# Memory: the API holds ~225 MB resident against the 512 MB free limit, and that
# budget assumes ONE worker. Raising --workers multiplies memory per process and
# will be OOM-killed; use --threads for concurrency instead.

services:
  - type: web
    name: medsphere-api
    runtime: python
    plan: free
    region: singapore          # closest free region to India; oregon also works
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --preload --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: GEMINI_API_KEY
        sync: false            # prompted for; never committed
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
