<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSphere — Compare Medicines</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="logo.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Arrows:wght@400..700&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Protest+Revolution&family=Rubik:ital,wght@0,300..900;1,300..900&family=Sixtyfour+Convergence&family=Tiny5&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bg.css">
    <link rel="stylesheet" href="loader.css">
    <!-- Shared tokens + components, loaded after the page's base styles. -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="components.css">
    <style>
        /* The homepage's soft white glow, kept but retuned to the shared token. */
        .layer-blur {
            height: 0;
            width: 30rem;
            z-index: -1;
            position: absolute;
            top: 46%;
            right: 10%;
            box-shadow: 0 0 900px 25px white;
            rotate: 10deg;
        }

        /* The compare form laid out around the gradient VS divider. */
        .compare-box {
            display: flex;
            align-items: flex-end;
            gap: var(--ms-space-4);
            flex-wrap: wrap;
            justify-content: center;
        }

        .compare-box .ms-field {
            flex: 1 1 240px;
            min-width: 220px;
        }

        /* The VS divider echoes the homepage pill: a gradient ring with the page
           colour punched out of the middle. */
        .compare-vs {
            flex-shrink: 0;
            align-self: center;
            display: grid;
            place-items: center;
            width: 3.4rem;
            height: 3.4rem;
            padding: 2px;
            border-radius: 50%;
            background-image: var(--ms-gradient);
            background-size: 200%;
            animation: ms-gradient-pan 2.6s linear infinite;
            box-shadow: var(--ms-glow-gold);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .compare-vs__inner {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--ms-bg);
            color: var(--ms-text);
        }

        .compare-actions {
            display: flex;
            justify-content: center;
            margin-top: var(--ms-space-5);
        }

        @media screen and (max-width: 768px) {
            .compare-box { flex-direction: column; align-items: stretch; }
            .compare-vs { align-self: center; }
        }
    </style>
</head>

<body data-ms-page="compare">
    <div id="main-content">
        <div class="layer-blur"></div>

        <main class="ms-shell">
            <div class="ms-title">
                <h2>Compare Medicines</h2>
                <h2 aria-hidden="true">Compare Medicines</h2>
            </div>

            <p class="ms-panel__body" style="text-align:center; max-width:640px; margin:0 auto var(--ms-space-5);">
                Dive deep into the details and compare pharmaceutical information side-by-side.
            </p>

            <div class="ms-panel ms-panel--lg ms-panel--static">
                <div class="compare-box">
                    <div class="ms-field">
                        <label class="ms-label" for="drug-name-input-1">First Drug</label>
                        <div class="ms-input-wrap">
                            <input type="text" id="drug-name-input-1" class="ms-input"
                                placeholder="Enter first drug name" autocomplete="off">
                        </div>
                    </div>

                    <span class="compare-vs" aria-hidden="true">
                        <span class="compare-vs__inner">VS</span>
                    </span>

                    <div class="ms-field">
                        <label class="ms-label" for="drug-name-input-2">Second Drug</label>
                        <div class="ms-input-wrap">
                            <input type="text" id="drug-name-input-2" class="ms-input"
                                placeholder="Enter second drug name" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div id="compare-error" class="ms-alert ms-alert--error" role="alert"
                    style="display:none; margin-top:var(--ms-space-4);">
                    <i class='bx bx-error-circle' aria-hidden="true"></i>
                    <span class="compare-error__text">Please enter names for both drugs to compare.</span>
                </div>

                <div class="compare-actions">
                    <button id="compare-button" class="ms-btn ms-btn--gradient" type="button">
                        <span class="ms-btn__label">
                            <i class='bx bx-git-compare' aria-hidden="true"></i> Compare
                        </span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="site-chrome.js" defer></script>
    <script>
        (function () {
            'use strict';

            var input1 = document.getElementById('drug-name-input-1');
            var input2 = document.getElementById('drug-name-input-2');
            var button = document.getElementById('compare-button');
            var errorBox = document.getElementById('compare-error');
            var errorText = errorBox ? errorBox.querySelector('.compare-error__text') : null;

            function showError(message) {
                if (!errorBox) return;
                if (errorText) errorText.textContent = message;
                errorBox.style.display = 'flex';
            }

            function clearError() {
                if (errorBox) errorBox.style.display = 'none';
            }

            /* Restore the previous search so users can tweak one name. */
            try {
                var saved = JSON.parse(sessionStorage.getItem('compareSearch') || 'null');
                if (saved) {
                    if (saved.drug1) input1.value = saved.drug1;
                    if (saved.drug2) input2.value = saved.drug2;
                }
            } catch (e) { /* ignore malformed storage */ }

            [input1, input2].forEach(function (el) {
                el.addEventListener('input', clearError);
            });

            button.addEventListener('click', function () {
                var drug1 = input1.value.trim();
                var drug2 = input2.value.trim();

                if (!drug1 || !drug2) {
                    showError('Please enter names for both drugs to compare.');
                    return;
                }

                clearError();
                try {
                    sessionStorage.setItem('compareSearch', JSON.stringify({ drug1: drug1, drug2: drug2 }));
                } catch (e) { /* storage may be unavailable; the query string carries the names */ }

                window.location.href = 'compare2.html?drug1=' +
                    encodeURIComponent(drug1) + '&drug2=' + encodeURIComponent(drug2);
            });
        })();
    </script>
</body>

</html>
