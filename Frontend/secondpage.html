<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Similar Alternatives</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bg.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="components.css">
  <style>
    /* ------------------------------------------------------------------
       Page-specific glue only. Colours/surfaces/typography come from the
       shared design system.
       ------------------------------------------------------------------ */

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .background .area { height: 100%; }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ms-space-3);
      flex-wrap: wrap;
      margin-bottom: var(--ms-space-5);
    }

    /* View toggle — rebuilt on top of the .ms-tabs look. JS toggles the
       `.table`/`.graph` state classes on #viewToggle. */
    .toggle-container { display: flex; justify-content: center; margin-bottom: var(--ms-space-5); }

    .toggle-switch {
      display: inline-flex;
      gap: var(--ms-space-1);
      padding: 0.3rem;
      border: 1px solid var(--ms-border-hairline);
      border-radius: var(--ms-radius-pill);
      background: var(--ms-surface-1);
      cursor: pointer;
    }

    .toggle-option {
      padding: 0.55rem 1.4rem;
      border-radius: var(--ms-radius-pill);
      color: var(--ms-text-muted);
      font-weight: 600;
      font-size: 0.86rem;
      transition: all var(--ms-dur) var(--ms-ease);
      user-select: none;
    }

    /* Highlight the active option based on the state class JS sets. */
    .toggle-switch.table .toggle-option:first-child,
    .toggle-switch.graph .toggle-option:last-child {
      background: var(--ms-gradient);
      background-size: 200%;
      animation: ms-gradient-pan 3.6s linear infinite;
      color: #1a1119;
      box-shadow: 0 4px 14px -4px rgba(200, 80, 192, 0.5);
    }

    /* Table view. */
    .table-view { width: 100%; border-collapse: separate; border-spacing: 0; }
    .table-view th,
    .table-view td {
      padding: 1.1rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--ms-border-hairline);
      color: var(--ms-text);
      font-size: 0.9rem;
    }
    .table-view th {
      position: sticky;
      top: 0;
      background: rgba(12, 12, 16, 0.92);
      backdrop-filter: blur(8px);
      color: var(--ms-text-bright);
      font-weight: 600;
      letter-spacing: 0.04em;
      z-index: 1;
    }
    .table-view tr { cursor: pointer; transition: background var(--ms-dur) ease; }
    .table-view tbody tr:hover { background: var(--ms-surface-2); }
    .smiles-cell { max-width: 240px; overflow-wrap: anywhere; color: var(--ms-text-muted); }

    /* Similarity badges — map onto ms-badge status variants. */
    .similarity-badge {
      display: inline-block;
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-pill);
      font-weight: 600;
      font-size: 0.78rem;
    }
    .high-similarity   { color: var(--ms-success); border-color: rgba(105, 181, 120, 0.4); background: rgba(105, 181, 120, 0.12); }
    .medium-similarity { color: var(--ms-warning); border-color: rgba(243, 156, 18, 0.4);  background: rgba(243, 156, 18, 0.12); }
    .low-similarity    { color: var(--ms-danger);  border-color: rgba(231, 76, 60, 0.4);   background: rgba(231, 76, 60, 0.12); }

    .action-buttons { display: flex; gap: var(--ms-space-2); flex-wrap: wrap; }

    /* Graph view — toggled by JS via style.display. */
    .graph-view { display: none; padding: var(--ms-space-5); }
    .bar-chart {
      display: flex;
      height: 350px;
      align-items: flex-end;
      gap: 24px;
      margin-top: 40px;
    }
    .bar {
      flex-grow: 1;
      min-width: 40px;
      border-radius: var(--ms-radius-sm) var(--ms-radius-sm) 0 0;
      background: var(--ms-gradient);
      background-size: 200%;
      animation: ms-gradient-pan 3.6s linear infinite;
      position: relative;
      cursor: pointer;
      transition: filter var(--ms-dur) ease, transform var(--ms-dur) ease;
    }
    .bar:hover { transform: scaleY(1.02); filter: brightness(1.15); box-shadow: var(--ms-glow-accent); }
    .bar-label {
      position: absolute;
      bottom: -30px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--ms-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-value {
      position: absolute;
      top: -25px;
      left: 0; right: 0;
      text-align: center;
      font-weight: 700;
      color: var(--ms-text-bright);
      font-variant-numeric: tabular-nums;
    }

    /* Modals — JS toggles `.active`; map onto ms-modal look. */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: var(--ms-space-4);
      background: rgba(2, 2, 4, 0.78);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ms-dur) ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      width: min(800px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      border: 1px solid var(--ms-border-strong);
      border-radius: var(--ms-radius-lg);
      background: var(--ms-surface-solid);
      background-image: var(--ms-glass);
      box-shadow: var(--ms-shadow-float);
      transform: translateY(16px);
      transition: transform var(--ms-dur) var(--ms-ease-out);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }

    .modal-header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--ms-space-3);
      padding: var(--ms-space-4);
      border-bottom: 1px solid var(--ms-border);
      background: rgba(12, 12, 16, 0.92);
      backdrop-filter: blur(8px);
    }
    .modal-title { margin: 0; font-size: 1.15rem; color: var(--ms-text-bright); }
    .modal-body { padding: var(--ms-space-4); }

    .drug-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      gap: var(--ms-space-4);
    }
    .detail-card {
      padding: var(--ms-space-3);
      border: 1px solid var(--ms-border-hairline);
      border-left: 2px solid rgba(251, 171, 126, 0.45);
      border-radius: var(--ms-radius-sm);
      background: var(--ms-surface-1);
      transition: border-left-color var(--ms-dur) ease, background var(--ms-dur) ease;
    }
    .detail-card:hover { border-left-color: var(--ms-accent-2); background: var(--ms-surface-2); }
    .detail-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ms-text-faint);
      margin-bottom: var(--ms-space-1);
    }
    .detail-content { font-size: 0.92rem; color: var(--ms-text); line-height: 1.6; overflow-wrap: anywhere; }

    /* Circular similarity meter — the SVG ring is driven directly by JS
       (stroke-dasharray/offset/stroke), so keep the SVG and just theme it. */
    .similarity-meter { display: flex; flex-direction: column; align-items: center; margin-bottom: var(--ms-space-5); }
    .circular-progress { position: relative; width: 200px; height: 200px; margin: 0 auto; }
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-circle { stroke: rgba(255, 255, 255, 0.08); }
    .progress-ring-progress { stroke: var(--ms-accent-2); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ms-ease-out); }
    .progress-value {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 700;
      color: var(--ms-text-bright);
      font-variant-numeric: tabular-nums;
    }
    .progress-label { text-align: center; margin-top: var(--ms-space-3); color: var(--ms-text-muted); }

    #structureImage { width: 100%; max-height: 400px; object-fit: contain; }

    @media screen and (max-width: 768px) {
      .table-view { display: block; overflow-x: auto; white-space: nowrap; }
      .table-view th:nth-child(3),
      .table-view td:nth-child(3) { display: none; }
      .action-buttons { flex-direction: column; }
      .circular-progress { width: 150px; height: 150px; }
      .drug-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-ms-page="alt">
  <main class="ms-shell ms-shell--wide">
    <div class="page-head">
      <h1 class="ms-heading" id="alternatives-title" style="margin:0; font-size: clamp(1.5rem, 1rem + 1.8vw, 2rem);">Similar Alternatives</h1>
      <button class="back-button ms-btn ms-btn--ghost" id="backButton">
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Main Page
      </button>
    </div>

    <div class="toggle-container">
      <div class="toggle-switch table" id="viewToggle">
        <div class="toggle-option">Table View</div>
        <div class="toggle-option">Graph View</div>
      </div>
    </div>

    <div class="view-container ms-panel ms-panel--static ms-panel--flush">
      <table class="table-view" id="tableView">
        <thead>
          <tr>
            <th>Drug Name</th>
            <th>Generic Name</th>
            <th>SMILES</th>
            <th>Similarity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="drugTableBody">
          <!-- Table rows will be populated by JavaScript -->
        </tbody>
      </table>

      <div class="graph-view" id="graphView">
        <div class="bar-chart" id="barChart">
          <!-- Bars will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <!-- Drug Detail Modal -->
  <div class="modal-overlay ms-modal" id="drugModal">
    <div class="modal-content ms-modal__panel">
      <div class="modal-header ms-modal__head">
        <h2 class="modal-title ms-modal__title" id="modalTitle">Drug Details</h2>
        <button class="modal-close ms-btn-icon" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body ms-modal__body" id="modalBody">
        <div class="similarity-meter">
          <div class="circular-progress">
            <svg class="progress-ring" width="200" height="200">
              <circle class="progress-ring-circle" stroke-width="10" fill="transparent" r="80" cx="100" cy="100"/>
              <circle class="progress-ring-progress" stroke-width="10" fill="transparent" r="80" cx="100" cy="100"/>
            </svg>
            <div class="progress-value" id="meterValue">0%</div>
          </div>
          <div class="progress-label">Similarity Score</div>
        </div>
        <div class="drug-details" id="drugDetails">
          <!-- Drug details will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <!-- Structure Modal -->
  <div class="modal-overlay ms-modal" id="structureModal">
    <div class="modal-content ms-modal__panel" style="max-width: 600px;">
      <div class="modal-header ms-modal__head">
        <h2 class="modal-title ms-modal__title">Molecular Structure</h2>
        <button class="modal-close ms-btn-icon" id="structureModalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body ms-modal__body">
        <img id="structureImage" alt="Molecular structure">
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="site-chrome.js" defer></script>
  <script src="script1.js"></script>
</body>
</html>
