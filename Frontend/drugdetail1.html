<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSphere — Drug Details</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="logo.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Arrows:wght@400..700&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Protest+Revolution&family=Rubik:ital,wght@0,300..900;1,300..900&family=Sixtyfour+Convergence&family=Tiny5&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bg.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="components.css">
    <style>
        /* Page-specific styling only. Surfaces, colours, buttons, panels, tabs,
           fields, badges, loaders and alerts all come from theme.css +
           components.css. What remains here is the layout of this page's two
           states (search vs. results) and the structure image frame. */

        /* Search state: centred hero, hidden once a search succeeds. */
        .search-container {
            max-width: 640px;
            margin: 0 auto;
            transition: opacity var(--ms-dur-slow) var(--ms-ease-out),
                        transform var(--ms-dur-slow) var(--ms-ease-out);
        }

        .search-container.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-16px);
            pointer-events: none;
            position: absolute;
        }

        .search-subtitle {
            text-align: center;
            margin-bottom: var(--ms-space-5);
            color: var(--ms-text-muted);
            font-size: 1.05rem;
        }

        /* Compose the field + button on one row, wrapping on narrow screens. */
        .search-row {
            display: flex;
            align-items: flex-end;
            gap: var(--ms-space-3);
        }

        .search-row .ms-field { flex: 1; min-width: 0; }

        .search-row .ms-btn { flex: 0 0 auto; }

        /* Results state: hidden until data arrives. */
        .drug-details-container {
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all var(--ms-dur-slow) var(--ms-ease-out);
        }

        .drug-details-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .drug-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: var(--ms-space-3);
            margin-bottom: var(--ms-space-5);
        }

        .drug-name {
            font-size: clamp(1.8rem, 1.2rem + 2vw, 2.5rem);
            margin: 0;
        }

        .drug-description {
            max-width: 820px;
            line-height: 1.7;
            color: var(--ms-text-muted);
        }

        /* Structure card: image frame beside the key/value column. */
        .drug-structure-card {
            display: flex;
            flex-wrap: wrap;
            gap: var(--ms-space-5);
        }

        .structure-image-container {
            flex: 1;
            min-width: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--ms-border-hairline);
            border-radius: var(--ms-radius);
            padding: var(--ms-space-4);
            color: var(--ms-text-faint);
            font-style: italic;
        }

        .structure-image {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
        }

        .basic-info { flex: 1; min-width: 280px; }

        /* Groups of brands / synonyms rendered as chip clusters. */
        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: var(--ms-space-2);
        }

        .not-available {
            color: var(--ms-text-faint);
            font-style: italic;
        }

        @media screen and (max-width: 768px) {
            .search-row { flex-direction: column; align-items: stretch; }
            .search-row .ms-btn { width: 100%; }
            .drug-structure-card { flex-direction: column; }
            .structure-image-container,
            .basic-info { min-width: 100%; }
        }
    </style>
</head>

<body data-ms-page="details">
    <!-- The shared background and sidebar are injected by site-chrome.js so
         every page shares one canonical definition instead of a hand-copied
         variant. Nothing is hard-coded here on purpose. -->

    <main class="ms-shell">
        <!-- Search state ------------------------------------------------ -->
        <div class="search-container" id="search-container">
            <div class="ms-title">
                <h2>Drug Information Finder</h2>
                <h2 aria-hidden="true">Drug Information Finder</h2>
            </div>
            <p class="search-subtitle">Search for detailed pharmaceutical information on any medication.</p>

            <div class="search-row">
                <div class="ms-field">
                    <label class="ms-label" for="drug-name-input">Drug name</label>
                    <div class="ms-input-wrap">
                        <input type="text" id="drug-name-input" class="ms-input"
                               placeholder="Enter drug name (e.g., Aspirin)" autocomplete="off">
                    </div>
                </div>
                <button id="search-button" class="ms-btn">
                    <i class='bx bx-search-alt'></i> Search
                </button>
            </div>

            <!-- Error / not-found feedback for the search state. -->
            <div id="search-message" hidden></div>

            <!-- Loading indicator, shown while a request is in flight. -->
            <div class="ms-loading" id="loader" hidden>
                <div class="ms-spinner"></div>
                <span>Fetching drug information…</span>
            </div>
        </div>

        <!-- Results state ----------------------------------------------- -->
        <div class="drug-details-container" id="drug-details-container">
            <div class="drug-header">
                <h1 class="drug-name ms-heading" id="drug-name"></h1>
                <div class="drug-class" id="drug-class"></div>
                <div class="drug-description" id="drug-description"></div>
            </div>

            <!-- Structure and basic-info panel. -->
            <div class="drug-card drug-structure-card ms-panel ms-panel--static ms-panel--lg">
                <div class="structure-image-container">
                    <img src="" alt="2D Structure" class="structure-image" id="structure-image">
                </div>
                <div class="basic-info">
                    <div class="ms-kv ms-grid">
                        <div class="info-item ms-kv__item">
                            <span class="info-label ms-kv__label">Generic Name</span>
                            <span class="info-value ms-kv__value" id="generic-name"></span>
                        </div>
                        <div class="info-item ms-kv__item">
                            <span class="info-label ms-kv__label">Brand Name</span>
                            <span class="info-value ms-kv__value" id="brand-name"></span>
                        </div>
                        <div class="info-item ms-kv__item">
                            <span class="info-label ms-kv__label">Approval status</span>
                            <span class="info-value ms-kv__value" id="approval"></span>
                        </div>
                        <div class="info-item ms-kv__item">
                            <span class="info-label ms-kv__label">Protein Binding</span>
                            <span class="info-value ms-kv__value" id="protein-binding"></span>
                        </div>
                        <div class="info-item ms-kv__item">
                            <span class="info-label ms-kv__label">Route of Elimination</span>
                            <span class="info-value ms-kv__value" id="routes"></span>
                        </div>
                        <div class="info-item ms-kv__item">
                            <span class="info-label ms-kv__label">Synonyms</span>
                            <span class="info-value ms-kv__value" id="synonyms"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Interactive tabs panel. -->
            <div class="drug-card ms-panel ms-panel--static ms-panel--lg">
                <div class="tabs-container">
                    <div class="tabs-header ms-tabs" role="tablist">
                        <button class="tab-button ms-tab is-active" data-tab="mechanism" role="tab" aria-selected="true">Mechanism</button>
                        <button class="tab-button ms-tab" data-tab="indication" role="tab" aria-selected="false">Indication</button>
                        <button class="tab-button ms-tab" data-tab="pharmacodynamics" role="tab" aria-selected="false">Pharmacodynamics</button>
                        <button class="tab-button ms-tab" data-tab="metabolism" role="tab" aria-selected="false">Metabolism</button>
                    </div>

                    <div class="tab-content ms-tabpanel" id="mechanism-tab" role="tabpanel">
                        <div class="info-value ms-kv__value" id="mechanism-content"></div>
                    </div>

                    <div class="tab-content ms-tabpanel" id="indication-tab" role="tabpanel" hidden>
                        <div class="info-value ms-kv__value" id="indication-content"></div>
                    </div>

                    <div class="tab-content ms-tabpanel" id="pharmacodynamics-tab" role="tabpanel" hidden>
                        <div class="info-value ms-kv__value" id="pharmacodynamics-content"></div>
                    </div>

                    <div class="tab-content ms-tabpanel" id="metabolism-tab" role="tabpanel" hidden>
                        <div class="info-value ms-kv__value" id="metabolism-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="site-chrome.js" defer></script>
    <script>
        // Drug Search Functionality
        const searchMessage = document.getElementById('search-message');

        // Renders a graceful failure (network / server error) into the search
        // state using the shared alert component.
        function showSearchError(message) {
            searchMessage.className = 'ms-alert ms-alert--error';
            searchMessage.innerHTML =
                '<i class="bx bx-error-circle" aria-hidden="true"></i><span>' +
                escapeHtml(message) + '</span>';
            searchMessage.hidden = false;
        }

        // Renders a "no such drug" 404 using the empty-state component.
        function showNotFound(message) {
            searchMessage.className = 'ms-empty';
            searchMessage.innerHTML =
                '<div class="ms-empty__icon"><i class="bx bx-capsule" aria-hidden="true"></i></div>' +
                '<p>' + escapeHtml(message) + '</p>';
            searchMessage.hidden = false;
        }

        function clearSearchMessage() {
            searchMessage.hidden = true;
            searchMessage.className = '';
            searchMessage.innerHTML = '';
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        document.getElementById('search-button').addEventListener('click', async () => {
            const drugNameInput = document.getElementById('drug-name-input');
            const drugName = drugNameInput.value.trim();

            if (!drugName) {
                showSearchError('Please enter a drug name.');
                return;
            }

            clearSearchMessage();
            document.getElementById('loader').hidden = false;

            try {
                // Single source of truth for the backend URL. apiFetch returns
                // parsed JSON and throws an Error carrying the backend's own
                // message (including the 404 "Drug 'X' not found." text).
                const drugData = await window.MedSphereConfig.apiFetch('/api/drug_details', { name: drugName });

                if (!drugData || !drugData.name) {
                    showNotFound(`No information found for "${drugName}".`);
                    return;
                }

                updateDrugDetails(drugData);

                document.getElementById('drug-details-container').classList.add('active');
                document.getElementById('drug-details-container').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error('Error fetching drug data:', error);
                const message = (error && error.message) || 'Failed to fetch drug information. Please try again.';
                // A "not found" message from the backend is a soft empty state;
                // anything else is a hard error.
                if (/not found/i.test(message)) {
                    showNotFound(message);
                    window.MedSphereConfig.renderSuggestions(searchMessage, error, searchFor);
                } else {
                    showSearchError(message);
                }
            } finally {
                document.getElementById('loader').hidden = true;
            }
        });

        // Tab functionality — toggles is-active on the tab and the `hidden`
        // attribute on the matching panel, matching the ms-tabs component.
        const tabButtons = document.querySelectorAll('.tab-button');
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(btn => {
                    btn.classList.remove('is-active');
                    btn.setAttribute('aria-selected', 'false');
                });
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.hidden = true;
                });

                button.classList.add('is-active');
                button.setAttribute('aria-selected', 'true');
                const tabId = button.getAttribute('data-tab') + '-tab';
                document.getElementById(tabId).hidden = false;
            });
        });

        // Function to update the UI with drug data
        function updateDrugDetails(drugData) {
            const isMissing = (value) =>
                value === undefined || value === null || value === '' || value === 'Not Available';

            // Plain-text field or an italic "Not Available".
            const formatData = (value) =>
                isMissing(value)
                    ? '<span class="not-available">Not Available</span>'
                    : escapeHtml(value);

            // Render a delimiter-separated string as a cluster of badges.
            const formatBadges = (value, delimiter, badgeClass) => {
                if (isMissing(value)) {
                    return '<span class="not-available">Not Available</span>';
                }
                const items = String(value)
                    .split(delimiter)
                    .map(part => part.trim())
                    .filter(part => part.length);
                if (!items.length) {
                    return '<span class="not-available">Not Available</span>';
                }
                return '<span class="badge-group">' +
                    items.map(item => '<span class="' + badgeClass + '">' + escapeHtml(item) + '</span>').join('') +
                    '</span>';
            };

            // Basic info
            document.getElementById('drug-name').textContent = drugData.name || 'Unknown Drug';
            document.getElementById('drug-class').innerHTML = isMissing(drugData.generic_name)
                ? ''
                : '<span class="ms-badge ms-badge--accent">' + escapeHtml(drugData.generic_name) + '</span>';
            document.getElementById('generic-name').innerHTML = formatData(drugData.generic_name);
            // brand_name is a comma-separated list of brands.
            document.getElementById('brand-name').innerHTML = formatBadges(drugData.brand_name, ',', 'ms-badge');
            const summary = !isMissing(drugData.description) ? drugData.description
                : (!isMissing(drugData.background) ? drugData.background : '');
            document.getElementById('drug-description').textContent =
                summary || 'No description available';

            // Additional info
            // The dataset has no half-life values at all (every row is empty),
            // so that row is replaced by approval status, which is always set.
            document.getElementById('approval').innerHTML = formatData(drugData.groups);
            document.getElementById('protein-binding').innerHTML = formatData(drugData.protein_binding);
            document.getElementById('routes').innerHTML = formatData(drugData.routes_of_administration);
            // The scraped "routes_of_administration" column actually holds
            // DrugBank's "Route of elimination" text, so it is labelled that way.
            // synonyms is newline-separated.
            document.getElementById('synonyms').innerHTML = formatBadges(drugData.synonyms, '\n', 'ms-chip');

            // Tab contents
            document.getElementById('mechanism-content').innerHTML = formatMechanism(drugData.mechanism);
            document.getElementById('indication-content').innerHTML = formatData(drugData.indication);
            document.getElementById('pharmacodynamics-content').innerHTML = formatData(drugData.pharmacodynamics);
            document.getElementById('metabolism-content').innerHTML = formatData(drugData.metabolism);

            // Update structure image if SMILES is available.
            const structureContainer = document.querySelector('.structure-image-container');
            if (drugData.smiles && drugData.smiles !== 'Not Available') {
                structureContainer.innerHTML =
                    '<img src="" alt="" class="structure-image" id="structure-image">';
                const img = document.getElementById('structure-image');
                img.src = `https://cactus.nci.nih.gov/chemical/structure/${encodeURIComponent(drugData.smiles)}/image`;
                img.alt = `2D Structure of ${drugData.name}`;
            } else {
                structureContainer.innerHTML =
                    '<span class="not-available">Structure not available</span>';
            }
        }

        // DrugBank's mechanism text ends with a flattened table, one target
        // per line: "AProstaglandin G/H synthase 2 inhibitor Humans". The
        // leading A/U is a flag (A = known action, U = unknown).
        function formatMechanism(mechanismText) {
            if (isMissingValue(mechanismText)) {
                return '<span class="not-available">Not Available</span>';
            }
            const parts = String(mechanismText).split(/\r?\n?TARGET ACTIONS ORGANISM\r?\n?/);
            let formatted = escapeHtml(parts[0].trim());
            const targets = (parts[1] || '').split(/\r?\n/)
                .map(line => line.trim())
                .filter(line => line.length > 1 && (line[0] === 'A' || line[0] === 'U'));
            if (targets.length) {
                formatted += '<br><br><strong>Molecular targets:</strong><ul class="ms-targets">' +
                    targets.map(line => '<li>' + escapeHtml(line.slice(1).trim()) +
                        (line[0] === 'U' ? ' <span class="ms-target-unknown">(action not confirmed)</span>' : '') +
                        '</li>').join('') + '</ul>';
            }
            return formatted;
        }

        function isMissingValue(value) {
            return value === undefined || value === null || value === '' || value === 'Not Available';
        }

        function searchFor(name) {
            document.getElementById('drug-name-input').value = name;
            document.getElementById('search-button').click();
        }
        window.MedSphereConfig.attachAutocomplete(document.getElementById('drug-name-input'), searchFor);

        // Handle Enter key in search input
        document.getElementById('drug-name-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('search-button').click();
            }
        });
    </script>
</body>

</html>
